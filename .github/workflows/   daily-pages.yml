name: Archives du jour (SEO)

on:
  schedule:
    - cron: '0 22 * * *'   # 23 h au Cameroun : la page du jour est quasi complète
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lumen-data
  cancel-in-progress: false

jobs:
  pages:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Installer les dépendances
        working-directory: scripts
        run: npm install --no-audit --no-fund

      - name: Générer la page du jour et le sitemap
        working-directory: scripts
        run: node build-pages.js

      - name: Enregistrer les changements
        run: |
          git config user.name "lumen-bot"
          git config user.email "lumen-bot@users.noreply.github.com"
          git add jour sitemap.xml data/archive.json
          if git diff --cached --quiet; then
            echo "Rien à enregistrer."
          else
            git commit -m "seo: archives du jour"
            git pull --rebase --autostash
            git push
          fi
