name: Dézipper LUMen v2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Dézipper et fusionner
        run: |
          set -e
          unzip -q -o lumen-site-v2-upload.zip -d _tmp
          rm -f _tmp/scripts/send-newsletter.js
          if [ -f scripts/package.json ]; then rm -f _tmp/scripts/package.json; fi
          cp -r _tmp/. .
          rm -rf _tmp lumen-site-v2-upload.zip

      - name: Enregistrer
        run: |
          git config user.name "lumen-bot"
          git config user.email "lumen-bot@users.noreply.github.com"
          git add -A
          git commit -m "LUMen v2 : phases 1, 3, 4, 5, 6"
          git push
