name: Dézipper et fusionner
on:
  push:
    paths: ['*.zip']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Dézipper et fusionner
        run: |
          set -e
          shopt -s nullglob
          zips=(*.zip)
          if [ ${#zips[@]} -eq 0 ]; then echo "Aucun zip à traiter."; exit 0; fi
          for z in "${zips[@]}"; do
            echo "Traitement de $z"
            unzip -o "$z"
            rm -f "$z"
          done
      - name: Enregistrer
        run: |
          git config user.name "lumen-bot"
          git config user.email "lumen-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Rien à enregistrer."; exit 0; fi
          git commit -m "site: mise à jour par zip"
          git pull --rebase origin ${{ github.ref_name }} || true
          git push
