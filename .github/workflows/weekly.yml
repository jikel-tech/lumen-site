name: Analyse hebdomadaire LUMen

on:
  schedule:
    - cron: '0 17 * * 0'   # dimanche 18 h au Cameroun
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lumen-data
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Installer les dépendances
        working-directory: scripts
        run: npm install --no-audit --no-fund

      - name: Rédiger l'analyse de la semaine
        working-directory: scripts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node weekly-analysis.js

      - name: Mettre à jour les archives et le sitemap
        working-directory: scripts
        run: node build-pages.js

      - name: Enregistrer les changements
        run: |
          git config user.name "lumen-bot"
          git config user.email "lumen-bot@users.noreply.github.com"
          for p in hebdo jour sitemap.xml data; do [ -e "$p" ] && git add -A "$p"; done
          if git diff --cached --quiet; then
            echo "Rien à enregistrer."
            exit 0
          fi
          git commit -m "content: analyse hebdomadaire"
          # Si un autre robot a écrit en même temps, on garde NOS versions des fichiers de données.
          for i in 1 2 3 4; do
            if git pull --rebase -X theirs --autostash && git push; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "Échec n°$i, nouvel essai..."
            sleep $((i * 5))
          done
          echo "::error::Impossible d'enregistrer les données après 4 essais"
          exit 1
