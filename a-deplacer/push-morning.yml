name: Notification push du matin

on:
  schedule:
    - cron: '30 6 * * *'   # 7 h 30 au Cameroun
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Simulation (n'envoie rien)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: lumen-data
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Installer les dépendances
        working-directory: scripts
        run: npm install --no-audit --no-fund

      - name: Envoyer la notification
        working-directory: scripts
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
        run: node send-push.js

      - name: Enregistrer les changements
        run: |
          git config user.name "lumen-bot"
          git config user.email "lumen-bot@users.noreply.github.com"
          git add data/pushed.json
          if git diff --cached --quiet; then
            echo "Rien à enregistrer."
          else
            git commit -m "data: notification envoyée [skip ci]"
            git pull --rebase --autostash
            git push
          fi
