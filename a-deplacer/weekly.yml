name: Analyse hebdomadaire LUMen

on:
  schedule:
    - cron: '0 17 * * 0'   # dimanche 18 h au Cameroun
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lumen-data
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Installer les dépendances
        working-directory: scripts
        run: npm install --no-audit --no-fund

      - name: Rédiger l'analyse de la semaine
        working-directory: scripts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node weekly-analysis.js

      - name: Mettre à jour les archives et le sitemap
        working-directory: scripts
        run: node build-pages.js

      - name: Enregistrer les changements
        run: |
          git config user.name "lumen-bot"
          git config user.email "lumen-bot@users.noreply.github.com"
          git add hebdo jour sitemap.xml data/weekly.json data/archive.json
          if git diff --cached --quiet; then
            echo "Rien à enregistrer."
          else
            git commit -m "content: analyse hebdomadaire"
            git pull --rebase --autostash
            git push
          fi
