[build]
  publish = "."
  # Pas d'étape de build : c'est un site statique.
  # Économie de crédits Netlify (15 crédits par mise en ligne, 300 crédits gratuits par mois) :
  # on ne redéploie PAS quand seuls changent les données du robot (data/), les zips d'envoi, les workflows
  # ou les scripts du robot (jamais servis au public). Les archives du jour (jour/) sont commitées avec
  # "[skip netlify]" et partent avec la mise en ligne suivante.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)data' ':(exclude)*.zip' ':(exclude).github' ':(exclude)scripts' ':(exclude)README-DEPLOY.md'"

[functions]
  directory = "netlify/functions"

# Le code des scripts et des fonctions n'a pas à être servi comme pages publiques.
[[redirects]]
  from = "/scripts/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/assets/categories/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
